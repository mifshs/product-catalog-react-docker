# nginx.conf — веб-сервер для готовой React-сборки.
#
# Nginx делает две вещи:
# 1. Раздает статические файлы Vite/React.
# 2. Проксирует /api/... в Express-контейнер по имени api.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Проксирование API-запросов на backend.
  location /api/ {
    proxy_pass http://api:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}